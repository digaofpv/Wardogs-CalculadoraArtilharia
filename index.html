<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Distância Wardogs</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wardogs">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#11140e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#11140e; --panel:#181d13; --key:#222a1a; --line:#38432e; --ink:#e4e6d3; --muted:#8c977a;
  --acc:#e0b03a; --accink:#17140a; --me:#6fb7d6; --tgt:#ea5a41; --focus:#e0b03a;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --cond:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  height:100%; margin:0; background-color:var(--bg); color:var(--ink);
  background-image:
    linear-gradient(rgba(228,230,211,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(228,230,211,.05) 1px,transparent 1px);
  background-size:24px 24px;
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.3;
}
main{
  height:100%; max-width:520px; margin:0 auto; padding:10px 12px 0;
  display:flex; flex-direction:column; gap:8px; overflow-y:auto;
}

.head{display:flex; align-items:center; justify-content:space-between; gap:8px; flex:none}
h1{
  display:flex; align-items:center; gap:8px; margin:0;
  font-family:var(--cond); font-weight:700; font-size:22px; line-height:1.1;
  letter-spacing:.16em; text-transform:uppercase;
}
.mark{display:block; width:10px; height:10px; background:var(--acc); transform:rotate(45deg)}
.tools{display:flex; gap:6px}
.btn{
  padding:7px 10px; background:transparent; color:var(--ink);
  border:1px solid var(--line); border-radius:2px;
  font:600 14px var(--cond); letter-spacing:.1em; text-transform:uppercase; cursor:pointer;
}
.btn:active{background:var(--key)}
.btn.danger{color:var(--tgt); border-color:var(--tgt)}
.btn:focus-visible,.k:focus-visible,input:focus-visible{outline:2px solid var(--focus); outline-offset:2px}

.line{display:grid; grid-template-columns:1fr 1fr; gap:4px 8px; align-items:center; flex:none}
.line .who{grid-column:1 / -1}
.who{
  display:flex; align-items:center; gap:7px;
  font:600 15px var(--cond); letter-spacing:.12em; text-transform:uppercase;
}
.dot{display:block; flex:none}
.dot.me{width:14px; height:10px; background:var(--me); border-radius:1px}
.dot.tgt{width:10px; height:10px; background:var(--tgt); transform:rotate(45deg)}
.in{position:relative}
.in span{
  position:absolute; left:10px; top:50%; transform:translateY(-50%);
  font:600 13px var(--cond); letter-spacing:.1em; color:var(--muted); pointer-events:none;
}
input[type=text]{
  width:100%; height:min(48px,7vh); padding:4px 8px 4px 30px;
  font:600 22px var(--mono); font-variant-numeric:tabular-nums;
  color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:2px;
  caret-color:var(--acc);
}
input.is-active{border-color:var(--acc); box-shadow:0 0 0 1px var(--acc); background:var(--key)}

.result{
  position:relative;
  flex:1 1 auto; min-height:0; display:flex; flex-direction:column; justify-content:center;
  background:rgba(24,29,19,.92); border:1px solid var(--line); border-radius:2px; padding:8px 14px;
}
.result::before{
  content:""; position:absolute; inset:-1px; pointer-events:none;
  background:
    linear-gradient(var(--acc),var(--acc)) top left / 16px 2px no-repeat,
    linear-gradient(var(--acc),var(--acc)) top left / 2px 16px no-repeat,
    linear-gradient(var(--acc),var(--acc)) top right / 16px 2px no-repeat,
    linear-gradient(var(--acc),var(--acc)) top right / 2px 16px no-repeat,
    linear-gradient(var(--acc),var(--acc)) bottom left / 16px 2px no-repeat,
    linear-gradient(var(--acc),var(--acc)) bottom left / 2px 16px no-repeat,
    linear-gradient(var(--acc),var(--acc)) bottom right / 16px 2px no-repeat,
    linear-gradient(var(--acc),var(--acc)) bottom right / 2px 16px no-repeat;
}
.result .top{display:flex; align-items:center; justify-content:space-between; gap:10px}
.big{
  font-family:var(--cond); font-weight:700;
  font-size:clamp(44px,min(16vw,9.5vh),72px); line-height:1; letter-spacing:.01em;
  font-variant-numeric:tabular-nums; word-break:break-all;
}
.big small{font-size:.4em; font-weight:600; margin-left:6px; color:var(--acc); letter-spacing:.1em; text-transform:uppercase}
.empty{color:var(--muted)}
.plot{flex:none; width:min(84px,10.5vh); height:min(84px,10.5vh)}
.plot circle.ring{fill:none; stroke:var(--line); stroke-width:1.3}
.plot line.vec{stroke:var(--tgt); stroke-width:2.5; stroke-linecap:round}
.plot line.ax{stroke:var(--line); stroke-width:1}
.plot line.tick{stroke:var(--muted); stroke-width:1.3}
.plot text{fill:var(--muted); font:600 11px var(--mono)}
dl{display:grid; grid-template-columns:repeat(3,1fr); gap:6px 10px; margin:8px 0 0; padding-top:8px; border-top:1px dashed var(--line)}
dt{font:600 11.5px var(--cond); letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
dd{margin:0; font:600 15px var(--mono); font-variant-numeric:tabular-nums}

.pad{
  flex:none; margin:0 -12px;
  background:var(--panel); border-top:2px solid var(--line);
  padding:8px 12px 10px;
  display:grid; grid-template-columns:repeat(4,1fr); grid-auto-rows:min(46px,6.2vh); gap:6px;
}
.k{
  border:1px solid var(--line); border-radius:2px; background:var(--key); color:var(--ink);
  font:600 22px var(--mono); cursor:pointer; padding:0;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
}
.k:active{background:var(--line)}
.k.zero{grid-column:span 2}
.k.go{
  grid-column:4; grid-row:2 / span 3; background:var(--acc); color:var(--accink); border-color:var(--acc);
  font:700 18px var(--cond); letter-spacing:.14em; text-transform:uppercase;
}
.k.go:active{background:#c79a2d}
.k.back{grid-column:4; font-size:20px}
</style>
</head>
<body>
<main>
  <div class="head">
    <h1><i class="mark"></i>Wardogs</h1>
    <div class="tools">
      <button type="button" class="btn" id="clear">Novo alvo</button>
      <button type="button" class="btn danger" id="reset">Limpar</button>
    </div>
  </div>

  <div class="line">
    <span class="who"><i class="dot tgt"></i>Alvo</span>
    <div class="in"><span>Y</span><input type="text" inputmode="none" id="ty" autocomplete="off" aria-label="Alvo, Y"></div>
    <div class="in"><span>X</span><input type="text" inputmode="none" id="tx" autocomplete="off" aria-label="Alvo, X"></div>
  </div>
  <div class="line">
    <span class="who"><i class="dot me"></i>Minha posição</span>
    <div class="in"><span>Y</span><input type="text" inputmode="none" id="my" autocomplete="off" aria-label="Minha posição, Y"></div>
    <div class="in"><span>X</span><input type="text" inputmode="none" id="mx" autocomplete="off" aria-label="Minha posição, X"></div>
  </div>

  <section class="result" aria-live="polite">
    <div class="top">
      <div class="big" id="big"><span class="empty">—</span></div>
      <svg class="plot" viewBox="0 0 120 120" aria-hidden="true">
        <circle class="ring" cx="60" cy="60" r="56"></circle>
        <circle class="ring" cx="60" cy="60" r="28"></circle>
        <line class="ax" x1="60" y1="6" x2="60" y2="114"></line>
        <line class="ax" x1="6" y1="60" x2="114" y2="60"></line>
        <line class="tick" x1="60.0" y1="4.0" x2="60.0" y2="10.0"></line>
        <line class="tick" x1="99.6" y1="20.4" x2="95.4" y2="24.6"></line>
        <line class="tick" x1="116.0" y1="60.0" x2="110.0" y2="60.0"></line>
        <line class="tick" x1="99.6" y1="99.6" x2="95.4" y2="95.4"></line>
        <line class="tick" x1="60.0" y1="116.0" x2="60.0" y2="110.0"></line>
        <line class="tick" x1="20.4" y1="99.6" x2="24.6" y2="95.4"></line>
        <line class="tick" x1="4.0" y1="60.0" x2="10.0" y2="60.0"></line>
        <line class="tick" x1="20.4" y1="20.4" x2="24.6" y2="24.6"></line>
        <text x="60" y="20" text-anchor="middle">N</text>
        <line class="vec" id="vec" x1="60" y1="60" x2="60" y2="60" visibility="hidden"></line>
        <circle cx="60" cy="60" r="5" fill="var(--me)"></circle>
        <circle id="ptg" cx="60" cy="60" r="5" fill="var(--tgt)" visibility="hidden"></circle>
      </svg>
    </div>
    <dl id="extras"></dl>
  </section>

  <div class="pad" id="pad" role="group" aria-label="Teclado numérico">
    <button type="button" class="k" data-k="1" tabindex="-1">1</button>
    <button type="button" class="k" data-k="2" tabindex="-1">2</button>
    <button type="button" class="k" data-k="3" tabindex="-1">3</button>
    <button type="button" class="k back" data-k="back" tabindex="-1" aria-label="Apagar">⌫</button>
    <button type="button" class="k" data-k="4" tabindex="-1">4</button>
    <button type="button" class="k" data-k="5" tabindex="-1">5</button>
    <button type="button" class="k" data-k="6" tabindex="-1">6</button>
    <button type="button" class="k" data-k="7" tabindex="-1">7</button>
    <button type="button" class="k" data-k="8" tabindex="-1">8</button>
    <button type="button" class="k" data-k="9" tabindex="-1">9</button>
    <button type="button" class="k" data-k="." tabindex="-1" aria-label="Ponto decimal">.</button>
    <button type="button" class="k zero" data-k="0" tabindex="-1">0</button>
    <button type="button" class="k go" data-k="next" tabindex="-1">Próximo</button>
  </div>
</main>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var ids = ['ty','tx','my','mx'];
  var active = 'ty', fresh = true;
  var nf0 = new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0});
  var nf1 = new Intl.NumberFormat('pt-BR',{maximumFractionDigits:1});
  var nf2 = new Intl.NumberFormat('pt-BR',{maximumFractionDigits:2});

  function setActive(id){
    active = id; fresh = true;
    ids.forEach(function(i){ $(i).classList.toggle('is-active', i===id); });
  }
  function val(id){
    var s = $(id).value.trim().replace(',','.');
    if(s==='') return null;
    var n = parseFloat(s);
    return isFinite(n) ? n : null;
  }

  try{
    var st = JSON.parse(localStorage.getItem('wardogs-xy')||'{}');
    if(typeof st.mx==='string') $('mx').value = st.mx;
    if(typeof st.my==='string') $('my').value = st.my;
  }catch(e){}
  function save(){
    try{ localStorage.setItem('wardogs-xy', JSON.stringify({mx:$('mx').value, my:$('my').value})); }catch(e){}
  }

  function row(l,v){ return '<div><dt>'+l+'</dt><dd>'+v+'</dd></div>'; }

  function render(){
    var mx=val('mx'), my=val('my'), tx=val('tx'), ty=val('ty');
    var vec=$('vec'), ptg=$('ptg');
    if([mx,my,tx,ty].some(function(n){return n===null;})){
      $('big').innerHTML = '<span class="empty">—</span>';
      $('extras').innerHTML =
        row('Δ Y','—') + row('Δ X','—') + row('Unidades (×100 m)','—') +
        row('Quilômetros','—') + row('Milhas náuticas','—') + row('Pés','—');
      vec.setAttribute('visibility','hidden'); ptg.setAttribute('visibility','hidden');
      return;
    }
    var dx=tx-mx, dy=ty-my;
    var u = Math.sqrt(dx*dx+dy*dy);
    var m = u*100;
    $('big').innerHTML = (m>=100 ? nf0.format(m) : nf1.format(m)) + '<small>m</small>';
    $('extras').innerHTML =
      row('Δ Y', nf0.format(dy*100)+' m') +
      row('Δ X', nf0.format(dx*100)+' m') +
      row('Unidades (×100 m)', nf2.format(u)) +
      row('Quilômetros', nf2.format(m/1000)) +
      row('Milhas náuticas', nf2.format(m/1852)) +
      row('Pés', nf0.format(m/0.3048));
    if(u>0){
      var ux=dx/u*50, uy=-dy/u*50;
      vec.setAttribute('x2',60+ux); vec.setAttribute('y2',60+uy);
      ptg.setAttribute('cx',60+ux); ptg.setAttribute('cy',60+uy);
      vec.setAttribute('visibility','visible'); ptg.setAttribute('visibility','visible');
    } else {
      vec.setAttribute('visibility','hidden'); ptg.setAttribute('visibility','hidden');
    }
  }

  ids.forEach(function(id, i){
    $(id).addEventListener('input', function(){ fresh = false; save(); render(); });
    $(id).addEventListener('keydown', function(e){
      if(e.key==='Enter'){
        e.preventDefault();
        if(i<ids.length-1) $(ids[i+1]).focus(); else $(id).blur();
      }
    });
    $(id).addEventListener('focus', function(){ setActive(id); try{ this.select(); }catch(e){} });
  });

  $('clear').addEventListener('click', function(){
    $('tx').value=''; $('ty').value=''; render(); $('ty').focus(); setActive('ty');
  });

  $('reset').addEventListener('click', function(){
    ids.forEach(function(i){ $(i).value=''; });
    try{ localStorage.removeItem('wardogs-xy'); }catch(e){}
    render(); $('ty').focus(); setActive('ty');
  });

  function nextField(){
    var i = ids.indexOf(active);
    var n = (i===ids.length-1) ? 'ty' : ids[i+1];
    $(n).focus(); setActive(n);
  }
  function press(k){
    if(k==='next'){ nextField(); return; }
    var el = $(active), v = el.value;
    if(k==='back'){ v = fresh ? '' : v.slice(0,-1); }
    else if(k==='.'){
      if(fresh || v==='') v = '0.';
      else if(v.indexOf('.')===-1) v += '.';
    } else { v = fresh ? k : v + k; }
    fresh = false;
    el.value = v; save(); render();
  }
  Array.prototype.forEach.call(document.querySelectorAll('.k'), function(b){
    b.addEventListener('mousedown', function(e){ e.preventDefault(); });
    b.addEventListener('click', function(){ press(b.getAttribute('data-k')); });
  });

  setActive('ty');
  render();

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
})();
</script>
</body>
</html>
